# Codespaces-only override: container-to-container bridge networking is broken there.
# Usage: export COMPOSE_FILE=docker-compose.yml:docker-compose.codespaces.yml
services:
  mysql:
    network_mode: host
  chroma:
    network_mode: host
  api:
    network_mode: host
    ports: !reset []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MYSQL_HOST: 127.0.0.1
      CHROMA_HOST: 127.0.0.1
  ci3:
    network_mode: host
    ports: !reset []
    environment:
      MYSQL_HOST: 127.0.0.1
      ATLAS_API_URL: http://127.0.0.1:8001
      CI_ENV: production
