services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: atlas
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_RO_PASSWORD: ${MYSQL_RO_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/02-users.sh:/docker-entrypoint-initdb.d/02-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  chroma:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  api:
    build: ./api
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      CHROMA_HOST: chroma
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mysql:
        condition: service_healthy
      chroma:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  mysql_data:
  chroma_data:
